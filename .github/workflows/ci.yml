name: CI
on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
jobs:
  build-html:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-python@v6
      with:
        python-version: '3.12'
        cache: 'pip'
        cache-dependency-path: 'source/requirements.txt'
    - name: Install Dependencies
      run: |
        pip install -r source/requirements.txt

    - name: Build HTML
      run: |
        make html
  build-pdf:
    runs-on: ubuntu-latest
    container: texlive/texlive:latest
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-python@v6
      with:
        python-version: '3.12'
        cache: 'pip'
        cache-dependency-path: 'source/requirements.txt'
    - name: Install Python Dependencies
      run: |
        pip install -r source/requirements.txt

    - name: Build PDF
      run: |
        make latexpdf
  check-links:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-python@v6
      with:
        python-version: '3.12'
        cache: 'pip'
        cache-dependency-path: 'source/requirements.txt'
    - name: Install Dependencies
      run: |
        pip install -r source/requirements.txt
    - name: Check Links
      run: |
        make linkcheck
